name: LedgerFlow CI

on:
  push:
    paths:
      - "finance-reconciliation-platform/**"
      - ".github/workflows/ledgerflow-ci.yml"
  pull_request:
    paths:
      - "finance-reconciliation-platform/**"
      - ".github/workflows/ledgerflow-ci.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-reconciliation-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: finance-reconciliation-platform/package-lock.json
      - run: npm install
      - run: npm run test
      - run: npm run build
